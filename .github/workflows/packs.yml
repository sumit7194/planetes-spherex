name: Build a pack (runs next to NASA's S3 bucket)

# Builds a target's SPHEREx pack (planetes-pack/1, measurements, spectrum, overlay) on a US runner,
# close to s3://nasa-irsa-spherex, and commits it to public/data. Re-run for every target when IRSA publishes a new release.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target id from pipeline/targets.json"
        required: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build
        working-directory: pipeline
        run: |
          uv sync
          uv run python planetes_pack.py "${{ inputs.target }}" --conc 48
      - name: Commit
        run: |
          git config user.name "planetes-bot"
          git config user.email "planetes-bot@users.noreply.github.com"
          git add public/data
          git commit -m "Pack: ${{ inputs.target }} (built on GitHub Actions)" || echo "nothing to commit"
          git push
