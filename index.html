<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Planetes, the wanderers in SPHEREx's sky: see how the sky changes, in NASA SPHEREx's infrared photographs."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      /* Dark unless the visitor chose Light (Sumit, 15 Nov; src/ui/scheme.ts), before first paint. */
      (function () {
        var pick = 'dark';
        try {
          if (localStorage.getItem('planetes-scheme') === 'light') pick = 'light';
        } catch (e) {}
        document.documentElement.dataset.scheme = pick;
        document.documentElement.dataset.ui = pick;
      })();
    </script>
    <title>Planetes · the wanderers in SPHEREx’s sky</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
